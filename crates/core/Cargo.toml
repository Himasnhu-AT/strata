[package]
name = "strata-core"
description = "Strata's headless core: file index, formats, search, filters, histogram, redaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The workspace lints, except `unsafe_code`: `deny` instead of `forbid`, so the one module that
# maps files (`mmap.rs`) can `#![allow(unsafe_code)]` with a `// SAFETY:` comment on every block.
# Keep this list in sync with `[workspace.lints]` in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
memchr = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { workspace = true }
# index stream: file maps, follow mode, .gz input
memmap2 = "0.9"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
same-file = "1"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# statfs: is a followed file on a network filesystem (no reliable file events there)?
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

# Parse and redaction throughput on `cargo xtask fixtures` output: `cargo bench -p strata-core --bench formats`.
[[bench]]
name = "formats"
harness = false

# Line index throughput: `cargo bench -p strata-core --bench index`.
[[bench]]
name = "index"
harness = false
