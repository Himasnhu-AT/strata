[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
repository = "https://github.com/Himasnhu-AT/strata"

[workspace.dependencies]
strata-core = { path = "crates/core", version = "0.1.0" }
# published as `ashlar-rs`; imported as `ashlar`
ashlar = { version = "0.2", package = "ashlar-rs" }
# Settings ▸ AI: install the MCP server into coding agents (not re-exported by ashlar-rs)
ashlar-agents = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# never crash (tests are exempted by clippy.toml)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
